name: Build and Notarize

on:
  # Intentionally no `push` trigger: a release is cut by tagging right after
  # merge (release.yml), which builds + publishes — building on the merge too
  # would double-build every release. PRs still validate below; run manually via
  # workflow_dispatch if needed.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Fail fast if a job hangs (e.g. electron-builder retrying a failed publish)
    # instead of sitting until the 6-hour default timeout.
    timeout-minutes: 30
    strategy:
      # Don't let one platform's failure cancel the others.
      fail-fast: false
      matrix:
        # windows-2022 (VS 2022 / v17) instead of windows-latest: the newer
        # windows-latest image ships Visual Studio 18, which the bundled
        # node-gyp@10.1.0 can't recognize, breaking better-sqlite3's native build.
        #
        # macOS is intentionally omitted from PR validation — macOS minutes bill
        # at 10x and our build issues are Windows-specific. macOS is still fully
        # built + notarized on release (release.yml). The macOS-only steps below
        # simply never run here.
        os: [ubuntu-latest, windows-2022]
        include:
          - os: ubuntu-latest
            build_cmd: npm run build:linux
          - os: windows-2022
            build_cmd: npm run build:win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Pre-download native binaries (sherpa-onnx for Parakeet) as a dedicated,
      # direct `node` step. Otherwise the build's prebuild hook runs this buried
      # inside `npm run build:win` → cmd → npm → cmd, and that nested chain hangs
      # on Windows during .tar.bz2 extraction. Running it directly here (and
      # caching resources/bin) means the build's prebuild finds the binaries
      # already present and skips the extraction. Mirrors OpenWhispr's setup.
      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: ${{ matrix.os }}-bin-${{ hashFiles('scripts/download-sherpa-onnx.js', 'scripts/lib/download-utils.js') }}

      - name: Pre-download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current

      # Create production .env file with app configuration
      # Note: Only PUBLIC config values are bundled (Supabase URL/publishable key, WS URL)
      # User API keys (PPQ_API_KEY) are NOT bundled - users enter them at runtime
      - name: Create production .env
        shell: bash
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          PPQVOICE_PPQ_WS_BASE_URL=${{ secrets.PPQVOICE_PPQ_WS_BASE_URL }}
          VITE_CHATWOOT_TOKEN=${{ secrets.VITE_CHATWOOT_TOKEN }}
          EOF

      # macOS code signing setup - industry standard approach
      - name: Setup macOS Code Signing
        if: matrix.os == 'macos-latest' && github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          # Create temp directory for certificates
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          API_KEY_PATH=$RUNNER_TEMP/api_key.p8
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificates from secrets
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > $API_KEY_PATH

          # Create temporary keychain
          security create-keychain -p "runner" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "runner" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Allow codesign to use the certificate
          security set-key-partition-list -S apple-tool:,apple: -s -k "runner" $KEYCHAIN_PATH

          # Export API key path for electron-builder (uses APPLE_API_KEY)
          echo "APPLE_API_KEY=$API_KEY_PATH" >> $GITHUB_ENV

      - name: Build Application
        run: ${{ matrix.build_cmd }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PPQ_GLOBE_LISTENER_REQUIRE_UNIVERSAL: "true"
          # Enable signing only for macOS non-PR builds
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && github.event_name != 'pull_request' && 'true' || 'false' }}
          # Notarization credentials (electron-builder standard)
          # APPLE_API_KEY is set from the file path in setup step
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: dist/
          retention-days: 7

      # Security cleanup - always run
      - name: Cleanup Certificates
        if: always() && matrix.os == 'macos-latest' && github.event_name != 'pull_request'
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/build_certificate.p12
          rm -f $RUNNER_TEMP/api_key.p8
