name: Release

on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string

permissions:
  contents: write # Required for creating releases

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}

    strategy:
      # Don't let one platform's failure cancel (and un-publish) the others.
      fail-fast: false
      matrix:
        # windows-2022 (VS 2022 / v17) instead of windows-latest: the newer
        # windows-latest image ships Visual Studio 18, which the bundled
        # node-gyp@10.1.0 can't recognize, breaking better-sqlite3's native build.
        os: [macos-latest, ubuntu-latest, windows-2022]
        include:
          - os: macos-latest
            build_cmd: npm run build:mac
          - os: ubuntu-latest
            build_cmd: npm run build:linux
          - os: windows-2022
            build_cmd: npm run build:win

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Create production .env file with app configuration
      # Note: Only PUBLIC config values are bundled (Supabase URL/publishable key, WS URL)
      # User API keys (PPQ_API_KEY) are NOT bundled - users enter them at runtime
      - name: Create production .env
        shell: bash
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          PPQVOICE_PPQ_WS_BASE_URL=${{ secrets.PPQVOICE_PPQ_WS_BASE_URL }}
          VITE_CHATWOOT_TOKEN=${{ secrets.VITE_CHATWOOT_TOKEN }}
          EOF

      # macOS code signing setup (same as build workflow)
      - name: Setup macOS Code Signing
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          # Create temp directory for certificates
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          API_KEY_PATH=$RUNNER_TEMP/api_key.p8
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificates from secrets
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > $API_KEY_PATH

          # Create temporary keychain
          security create-keychain -p "runner" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "runner" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Allow codesign to use the certificate
          security set-key-partition-list -S apple-tool:,apple: -s -k "runner" $KEYCHAIN_PATH

          # Export API key path for electron-builder (uses APPLE_API_KEY)
          echo "APPLE_API_KEY=$API_KEY_PATH" >> $GITHUB_ENV

      - name: Build Application
        run: ${{ matrix.build_cmd }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PPQ_GLOBE_LISTENER_REQUIRE_UNIVERSAL: "true"
          # Enable signing only for macOS
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && 'true' || 'false' }}
          # Certificate password for signing
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Notarization credentials (electron-builder standard)
          # APPLE_API_KEY is set from the file path in setup step
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Security cleanup
      - name: Cleanup Certificates
        if: always() && matrix.os == 'macos-latest'
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/build_certificate.p12
          rm -f $RUNNER_TEMP/api_key.p8
